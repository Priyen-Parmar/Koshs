name: Verify Kosh
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KOSH_VISION_MODEL: ""
      KOSH_DEMO_DATE: "2026-11-23"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements.txt -r tests/requirements.txt
      - run: python -m pytest
      - run: docker build -t kosh .
      - run: |
          docker run -d --name kosh -p 8765:8765 kosh
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://localhost:8765/healthz
