<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" role="img" aria-labelledby="intake-title">
  <title id="intake-title">A stack of invoices filed in a teal accounts ledger</title>
  <!-- The ruled book lies underneath the loose invoice sheets. -->
  <g transform="rotate(-6 154 103)">
    <path d="m37 104 129-35 94 31 1 13-132 31-92-29Z" fill="#204e43" stroke="#184739" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="m39 103 128-34 93 31-131 32Z" fill="#5b9c84"/>
    <path d="m41 107 87 28 128-32v6l-128 31-87-27Z" fill="#f0ead1"/>
    <path d="m45 110 83 26 124-31m-123 33 119-29" fill="none" stroke="#b9bd9c" stroke-width=".95"/>
    <path d="m36 102 8-2 92 29-8 3Z" fill="#c8d9bc"/>
    <path d="m129 132 1 11m91-33 9-2v13l-4-2-4 4Z" fill="#97c4a6" stroke="#467c61" stroke-width=".8"/>
  </g>
  <!-- Three offset paper edges preserve the silhouette even at small sizes. -->
  <path d="m53 88 114-61 79 40-110 60Z" fill="#d8d7ba" stroke="#788c75" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="m53 84 113-60 80 40-111 60Z" fill="#f7f1db" stroke="#8d9d84" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="m53 80 114-60 80 41-112 60Z" fill="#fff9e7" stroke="#789780" stroke-width="1.1" stroke-linejoin="round"/>
  <g transform="matrix(.94 .45 -.84 .47 154 13)">
    <path d="M0 0h86l11 11v117H0Z" fill="#fffcec" stroke="#5d7b68" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M86 0v11h11Z" fill="#d5dfc4" stroke="#789780" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- An invoice monogram, title and rule in the paper's own perspective. -->
    <path d="M10 10h15v15H10Z" fill="#195747"/>
    <path d="M14 20v-5h6m-6 3h4" fill="none" stroke="#f8f9dc" stroke-width="1.8"/>
    <text x="31" y="22" font-family="Georgia,serif" font-size="13.4" font-weight="bold" fill="#244a3c">Invoice</text>
    <path d="M10 31h76" fill="none" stroke="#7f9d80" stroke-width="1.1"/>
    <g fill="#82a38a">
      <path d="M10 37h34v2H10zm0 5h25v1.6H10zm0 5h19v1.5H10zM64 37h17v1.8H64zm4 5h13v1.6H68z"/>
    </g>
    <rect x="10" y="57" width="75" height="8" rx="1.2" fill="#c5d8be"/>
    <g fill="none" stroke-linecap="round">
      <path d="M14 61h15m26 0h5m10 0h10" stroke="#426b51" stroke-width="1.5"/>
      <path d="M10 71h31m14 0h7m7 0h15M10 79h20m25 0h7m7 0h15M10 87h27m18 0h7m7 0h15" stroke="#8ba48c" stroke-width="1.5"/>
      <path d="M10 93h75" stroke="#a7b99e" stroke-width="1.1"/>
      <path d="M48 101h13m8 0h15m-35 7h12m8 0h15" stroke="#68876e" stroke-width="1.8"/>
    </g>
    <path d="M10 113h29m-29 3h16" fill="none" stroke="#b3bca0" stroke-width="1.6"/>
  </g>
  <!-- Narrow tab wraps the ledger edge; the inset stitch follows the fold. -->
  <path d="m190 99 12-7 35 12-12 7Z" fill="#3d816d" stroke="#356c59" stroke-linejoin="round"/>
  <path d="m225 111 12-7v12l-12 5Z" fill="#216552" stroke="#356c59" stroke-linejoin="round"/>
  <path d="m195 98 29 10 9-4m-5 9 6-3" fill="none" stroke="#b4d0af" stroke-width="1.1" stroke-linecap="round"/>
</svg>
